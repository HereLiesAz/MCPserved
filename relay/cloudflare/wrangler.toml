name = "mcpserved-relay"
main = "worker.js"
compatibility_date = "2024-09-01"

# The relay is reachable at its account's own *.workers.dev URL out of the box.
# A branded custom domain is the operator's own choice, not shipped here — each
# operator deploys this Worker to their own account, so no personal domain is
# hardcoded in the shared repo. To add one, uncomment and set your own host (a
# subdomain in a Cloudflare zone on the same account); Cloudflare provisions the
# DNS record and TLS cert on `wrangler deploy`, and WebSockets pass through
# unchanged. Do NOT use a hostname you've pointed at a named tunnel (the phone's
# no-desktop connector) — the custom domain would fight the tunnel's DNS route.
#
# routes = [
#     { pattern = "mcp.yourdomain.com", custom_domain = true },
# ]

# Durable Object that pairs a device and a host by room token and relays
# sealed frames between them. One instance per room; Cloudflare shards and
# scales this automatically.
[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
