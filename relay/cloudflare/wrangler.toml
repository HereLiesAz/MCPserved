name = "mcpserved-relay"
main = "worker.js"
compatibility_date = "2024-09-01"

# Custom domains for the relay. Each gives the Worker a stable, branded host
# in place of the rotating *.workers.dev name, and Cloudflare provisions the
# DNS record and TLS cert automatically on `wrangler deploy`. WebSockets
# (the /connect upgrade) pass through custom domains unchanged.
#
# Prerequisite: each hostname's zone (azphalt.store, hereliesaz.com) must be
# on the same Cloudflare account as this Worker. A custom domain owns the whole
# hostname — correct here, since the relay is the only thing served at each.
# Clients then point MCPSERVED_RELAY_URL at wss://<host> (no trailing /connect).
routes = [
    { pattern = "mcp.azphalt.store", custom_domain = true },
    { pattern = "mcpserved.hereliesaz.com", custom_domain = true },
]

# Durable Object that pairs a device and a host by room token and relays
# sealed frames between them. One instance per room; Cloudflare shards and
# scales this automatically.
[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
